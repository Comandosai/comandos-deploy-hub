interface:
  display_name: Развертывание и обновление n8n
  short_description: Проверяет сервер, определяет наличие n8n, ставит новый или обновляет существующий через n8n-stack-v2 и собирает только недостающие параметры.
  default_prompt: Подключись к серверу, проверь наличие n8n, при необходимости спроси про обновление, затем установи или обнови n8n через n8n-stack-v2 и дай краткий отчет.
