display_name: Поиск и импорт тем CyberSEO
short_description: Собирает темы для блога, строит главные темы и подтемы, убирает дубли и импортирует в очередь CyberSEO.
default_prompt: Найди темы для CyberSEO: прочитай cyberseo.project.yml и .cyberseo.state.yml, проверь очередь и опубликованные статьи, собери темы без дублей и подготовь импорт.
