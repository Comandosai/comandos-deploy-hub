display_name: Развёртывание CyberSEO
short_description: Ставит или обновляет CyberSEO, скачивает закрытый архив по лицензии и сохраняет настройки проекта.
default_prompt: Разверни CyberSEO: прочитай cyberseo.project.yml и .cyberseo.state.yml, скачай закрытый архив по лицензии, настрой связь с WordPress и проверь установку.
