display_name: Telegram-тестирование бота
short_description: Поднимает локальную Telegram-сессию, собирает контекст из папки клиента, проводит тестовые диалоги с ботом и сохраняет отчет.
default_prompt: Подготовь Telegram-тестирование, собери контекст из папки клиента, проведи серию тестов с ботом и сохрани итоговый отчет.
