# Файл проекта CyberSEO.
# Заполни только то, что знаешь.
# Если поле не нужно или пока неизвестно, оставь пустым.
# Агент работает только с этим YAML-файлом и не создаёт отдельный .cyberseo.state.yml.

server:
  # SSH-доступ к серверу. Можно указать IP, домен или SSH-алиас.
  # Пример: "root@123.123.123.123" или "my-server".
  ssh_host: ""

  # SSH-порт. Обычно 22.
  ssh_port: 22

domains:
  # Домен WordPress / блога.
  # Пример: "blog.example.com".
  wordpress: ""

  # Домен панели управления CyberSEO.
  # Пример: "seo.example.com".
  cyberseo_panel: ""

license:
  # Лицензионный ключ CyberSEO.
  cyberseo_key: ""

keys:
  # Ключ KIE / Krea AI для генерации изображений.
  # Заполняй, если хочешь использовать свой баланс KIE.
  # Если изображения будут идти через баланс CyberSEO, оставь пустым.
  kie_api_key: ""

  # Ключ Perplexity.
  # Заполняй, если хочешь использовать свой баланс Perplexity.
  # Если хочешь работать через баланс CyberSEO, оставь пустым.
  perplexity_api_key: ""

  # Ключ Firecrawl для анализа сайтов конкурентов.
  # Если не нужен, оставь пустым.
  firecrawl_api_key: ""

telegram:
  # Токен Telegram-бота для уведомлений.
  # Если bot_token и chat_id заполнены, уведомления включатся автоматически.
  # Если одно из полей пустое, Telegram не используется.
  bot_token: ""

  # ID Telegram-чата, куда отправлять уведомления.
  chat_id: ""

wordpress:
  # Email администратора WordPress.
  admin_email: ""

  # Логин администратора WordPress.
  # Если оставить пустым, агент задаст стандартный логин.
  admin_username: ""

site:
  # Название сайта.
  site_title: ""

  # Короткое описание сайта.
  site_description: ""

  # Название блога.
  blog_title: ""

  # Описание блога.
  blog_description: ""

  # Текст для блока "О блоге".
  about_blog: ""

  # Путь к логотипу на сервере или локальной машине агента.
  # Пример: "/root/files/logo.png".
  logo_path: ""

  # Путь к favicon.
  # Пример: "/root/files/favicon.png".
  favicon_path: ""

  # Путь к референсной картинке для генерации изображений.
  # Пример: "/root/files/photo-reference.jpg".
  reference_image_path: ""

topics:
  # Основная тема / ниша для поиска тем.
  # Пример: "имплантация зубов".
  main_topic: ""

  # Страна для подбора тем и ключей.
  # Пример: "Россия".
  country: ""

  # Город, если нужен локальный блог.
  # Пример: "Москва".
  city: ""

  # Язык ключей и статей.
  # Если пусто, агент выберет язык по стране.
  # Примеры: "ru", "de", "en".
  # Пример: страна "Германия", город "Берлин", language "ru" — пишем для русскоязычных людей в Германии.
  language: ""

  # Сколько тем найти.
  count: 50

prompts:
  # Промпт писателя.
  # Если пусто, агент предложит вариант позже.
  writer_style_prompt: ""

  # Промпт художника.
  # Если пусто, агент предложит вариант позже.
  image_style_prompt: ""

state:
  # Служебный блок. Его заполняет агент во время развёртывания и импорта.
  # Пользователь руками обычно не трогает.
  wordpress:
    # WordPress уже развёрнут агентом.
    installed: false

    # Адрес админки WordPress.
    admin_url: ""

    # Логин администратора WordPress.
    admin_username: ""

    # Пароль администратора WordPress, созданный агентом.
    admin_password: ""

    # Пароль приложения WordPress для публикации.
    app_password: ""

    # Язык установленного WordPress, например ru_RU, de_DE, en_US.
    locale: ""

  cyberseo:
    # CyberSEO уже развёрнут агентом.
    installed: false

    # Адрес панели CyberSEO.
    panel_url: ""

    # Адрес API CyberSEO.
    api_url: ""

    # Админ-токен CyberSEO, созданный при развёртывании.
    admin_token: ""

    # Последняя проверка /healthz прошла успешно.
    healthz_ok: false

  import:
    # Профиль сайта импортирован в WordPress.
    wordpress_profile_imported: false

    # Настройки и секреты импортированы в CyberSEO.
    cyberseo_settings_imported: false

    # Темы импортированы в очередь CyberSEO.
    topics_imported: false

  topics:
    # Темы уже подготовлены агентом.
    generated: false

    # Список тем для импорта. Агент заполняет массивом объектов.
    rows: []

    # Короткий отчёт по темам: что добавлено, что пропущено, где возможные дубли.
    report: ""
